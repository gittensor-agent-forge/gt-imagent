name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # The engine is pinned by tag so a challenge is always judged by a known
  # version. Bump this deliberately, never automatically.
  IMAGENT_BENCH_REF: v0.1.0

jobs:
  agent:
    name: agent
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The agent is stdlib-only and loaded by path, so pytest is all it needs.
      - name: Install pytest
        run: python -m pip install -U pip pytest

      - name: Run tests
        run: python -m pytest

  contract:
    name: contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the pinned engine
        run: |
          python -m pip install -U pip
          python -m pip install "git+https://github.com/gittensor-agent-forge/gt-imagent-bench@${IMAGENT_BENCH_REF}"

      # Proves this repository still satisfies the submission contract: the
      # manifest parses and the declared entrypoint imports. No network, no
      # credits spent.
      - name: Verify the agent loads
        run: |
          python - <<'PY'
          from pathlib import Path
          from imagent_bench.agent_loader import load_agent

          agent, manifest = load_agent(Path("."))
          assert hasattr(agent, "setup"), "agent is missing setup()"
          assert hasattr(agent, "generate"), "agent is missing generate()"
          print(f"loaded {manifest.get('name')} via {manifest.get('entrypoint')}")
          PY

# Repository-wide tool configuration only.
#
# This file is deliberately NOT a Python distribution. Packaging lives with the
# component that needs it:
#
#   bench/pyproject.toml  -> imagent-bench  (Apache-2.0), the only installable
#   agent/                -> not packaged; loaded by path via agent/agent.yaml
#
# See docs/architecture.md for why the agent is loaded rather than installed.

[tool.pytest.ini_options]
testpaths = ["agent/tests"]
addopts = "-q"

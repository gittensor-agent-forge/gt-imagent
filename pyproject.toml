# The competition repository.
#
# Two Python surfaces live here and they are deliberately different:
#
#   agent/        stdlib-only, loaded BY PATH by the benchmark, never installed.
#                 This is the reigning agent and the thing a challenger forks.
#   competition/  the competition machinery: screening, challenges, promotion,
#                 the reign record, standings, and the lifecycle bot.
#
# The benchmark itself is not here. It lives in gt-imagent-bench and is consumed
# as a pinned dependency, so a challenge is always judged by a known version.

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imagent-competition"
version = "0.1.0"
description = "King-of-the-hill competition machinery for Imagent."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "imagent-bench",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
include = ["competition*"]

[tool.pytest.ini_options]
# The agent is loaded by path, so its tests live beside it.
testpaths = ["tests"]
addopts = "-q"

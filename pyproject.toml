# Repository-wide tool configuration only.
#
# This file is deliberately NOT a Python distribution. The agent is stdlib-only
# and loaded by path via agent/agent.yaml, never installed.
#
# The scoring engine lives in its own repository, gt-imagent-bench, and is
# consumed here as a pinned git tag. See docs/architecture.md.

[tool.pytest.ini_options]
testpaths = ["agent/tests"]
addopts = "-q"
